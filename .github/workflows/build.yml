name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: |
          node --check main.js
          node --check preload.js
          node --check lib/signaling.js
          node --check lib/store.js
          node --check renderer/app.js

      - name: Signaling tests
        run: npm test

      - name: Portable zip (stock signed electron.exe)
        run: npm run pack

      - name: Installer (NSIS)
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: SoundBridge-installer
          path: dist/installer/SoundBridge-Setup-*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SoundBridge-portable
          path: dist/SoundBridge-win-x64-*.zip
          if-no-files-found: error
