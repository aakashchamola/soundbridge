name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: |
          node --check main.js
          node --check preload.js
          node --check lib/signaling.js
          node --check lib/store.js
          node --check renderer/app.js

      - name: Signaling tests
        run: npm test

      - name: Package portable build
        run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: SoundBridge-win-x64
          path: dist/*.zip
          if-no-files-found: error
