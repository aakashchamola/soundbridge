<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2a4d"/>
      <stop offset="1" stop-color="#0d1019"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fa6ff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
  </defs>
  <!-- rounded tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#3a4a7a" stroke-width="6"/>
  <!-- two endpoints -->
  <circle cx="112" cy="256" r="44" fill="#e6e8ee"/>
  <circle cx="400" cy="256" r="44" fill="#e6e8ee"/>
  <!-- the bridge: one clean sound wave from node to node -->
  <path d="M156 256 C 176 256, 186 176, 206 176 C 226 176, 236 256, 256 256 C 276 256, 286 336, 306 336 C 326 336, 336 256, 356 256"
        fill="none" stroke="url(#wave)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
